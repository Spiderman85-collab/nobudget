<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>NoBudget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoBudget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414;
  --surface:#1f1f1f;
  --surface-2:#2b2b2b;
  --line:#303030;
  --text:#f5f5f5;
  --muted:#9b9b9b;
  --red:#e50914;
  --pos:#46d369;
  --neg:#ff5a5f;
  --pos-on-light:#0b7a2b;
  --neg-on-light:#b3000a;
  --display:'Bebas Neue','Oswald',sans-serif-condensed,'Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --dockH:0px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.35;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:absolute;inset:0 0 auto 0;height:340px;pointer-events:none;
  background:radial-gradient(110% 100% at 50% -20%,rgba(229,9,20,.26),rgba(229,9,20,0) 62%);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.app{position:relative;max-width:520px;margin:0 auto;padding:0 16px}

/* Intestazione */
.top{display:flex;align-items:center;gap:4px;padding:18px 0 4px;min-height:60px}
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.06em;color:var(--red)}
.logo button{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit}
.back{
  flex:none;width:40px;height:40px;margin-left:-8px;border:0;background:none;border-radius:50%;
  display:grid;place-items:center;padding:0;
}
.back:active{background:var(--surface-2)}
.back svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Home */
.homewrap{display:flex;flex-direction:column;gap:14px;padding-top:22px}
.bigtile{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  width:100%;min-height:158px;padding:18px 18px 16px;border:0;border-radius:10px;text-align:left;color:#fff;
}
.bigtile.budget{background:var(--red)}
.bigtile.stats{background:var(--surface-2)}
.bigtile:active{filter:brightness(.88)}
.bigtile .bt-title{display:block;max-width:100%;font-family:var(--display);font-size:60px;line-height:.9;letter-spacing:.03em;white-space:nowrap}
.bigtile .bt-sub{font-size:14.5px;line-height:1.3}
.bigtile.budget .bt-sub{color:rgba(255,255,255,.9)}
.bigtile.stats .bt-sub{color:var(--muted)}
.bigtile .bt-ico{position:absolute;top:16px;right:16px;width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.homenote{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.homenote p{margin:0 0 12px}
.backup{display:flex;gap:8px}
.backup button{
  flex:1;min-height:44px;border:1.5px solid rgba(255,255,255,.28);background:none;border-radius:6px;
  font-weight:600;font-size:14.5px;color:var(--text);
}
.backup button:active{background:var(--surface-2)}

/* Mese */
.monthbar{display:flex;align-items:center;gap:12px;padding:14px 0 14px}
.mtitle{flex:1;min-width:0}
.mname{
  margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(44px,14vw,64px);line-height:.95;letter-spacing:.02em;white-space:nowrap;
}
.mperiod{margin:6px 0 0;color:var(--muted);font-size:14px}
.arrow{
  flex:none;width:46px;height:46px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);background:rgba(20,20,20,.6);
  display:grid;place-items:center;padding:0;
}
.arrow:active{background:rgba(255,255,255,.16)}
.arrow[aria-disabled="true"]{opacity:.25;pointer-events:none}
.arrow svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.strip{
  display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none}
.tile{
  flex:none;width:68px;padding:8px 0 7px;border:0;border-radius:6px;
  background:var(--surface);color:var(--text);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.tile .tm{font-family:var(--display);font-size:27px;line-height:1;letter-spacing:.04em}
.tile .ty{font-size:11px;color:var(--muted);line-height:1.2}
.tile .ts{font-size:11px;font-weight:600;line-height:1.3;margin-top:2px}
.tile .ts.pos{color:var(--pos)}
.tile .ts.neg{color:var(--neg)}
.tile[aria-current="true"]{background:#fff;color:#141414}
.tile[aria-current="true"] .ty{color:#555}
.tile[aria-current="true"] .ts.pos{color:var(--pos-on-light)}
.tile[aria-current="true"] .ts.neg{color:var(--neg-on-light)}

.toolbar{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 12px;
  border:1.5px solid rgba(255,255,255,.3);border-radius:22px;background:none;font-weight:600;font-size:14.5px;
}
.pill svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill:active{background:var(--surface-2)}
.pill[aria-pressed="true"]{background:#fff;color:#141414;border-color:#fff}
.pill[aria-pressed="true"] svg{stroke:#141414}
.colh{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;line-height:1.2}
.edithint{margin:-2px 0 10px;color:var(--muted);font-size:13.5px}
.minus{display:none;flex:none;width:40px;height:40px;margin-left:-6px;border:0;background:none;padding:0;place-items:center}
.minus i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red)}
.minus svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.list.editing .minus{display:grid}
.offhead{padding:16px 0 6px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.offrow{min-height:52px}
.offrow .t{color:var(--muted);text-decoration:line-through}
.restore{
  flex:none;height:40px;padding:0 14px;border:1.5px solid rgba(255,255,255,.3);border-radius:20px;
  background:none;font-weight:600;font-size:14px;
}
.restore:active{background:var(--surface-2)}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;min-height:60px;padding:7px 0;border-bottom:1px solid var(--line)}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm .t{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12.5px;line-height:1.25}
.row.edited .nm .t::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--red);margin-right:8px;vertical-align:middle;position:relative;top:-1px;
}
.reset{
  flex:none;width:40px;height:40px;border:0;background:none;border-radius:50%;
  display:grid;place-items:center;padding:0;visibility:hidden;
}
.reset svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reset:active{background:var(--surface-2)}
.row.edited .reset{visibility:visible}
.list.editing .row .reset{visibility:hidden}
.amt{
  flex:none;width:132px;height:46px;display:flex;align-items:center;gap:6px;
  padding:0 12px;border-radius:8px;background:var(--surface-2);border:2px solid transparent;
}
.amt:focus-within{border-color:#fff;background:#333}
.amt input{
  flex:1;min-width:0;width:100%;background:none;border:0;outline:none;padding:0;
  color:var(--text);font:inherit;font-size:17px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;
}
.amt input.bad{color:var(--neg)}
.amt .eur{color:var(--muted);font-size:15px}
.row.zero .amt input{color:var(--muted);font-weight:500}

.sum{margin-top:18px;border-top:2px solid var(--line)}
.sum .row{min-height:56px}
.sum .val{width:132px;flex:none;text-align:right;padding-right:14px;font-size:17px;font-weight:600}
.sum .val .eur{color:var(--muted);font-weight:500;margin-left:6px}
.sum .row.total .t{font-weight:700}
.sum .row.rev{border-bottom:0}
.sum .row.rev .t{font-weight:700;font-size:17px}
.sum .row.rev .amt input{font-size:19px;font-weight:700}

.dock{
  position:sticky;bottom:0;z-index:5;margin:22px -16px 0;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(20,20,20,.94);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.saldo{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.saldo .lbl{font-family:var(--display);font-size:30px;letter-spacing:.06em;line-height:1}
.saldo .num{font-family:var(--display);font-size:52px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.saldo .num.pos{color:var(--pos)}
.saldo .num.neg{color:var(--neg)}
.saldo .num small{font-size:30px;color:var(--muted);margin-left:6px}

/* Avvisi */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:30;
  width:calc(100% - 32px);max-width:488px;
  bottom:calc(var(--dockH,0px) + 14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 7px 7px 14px;border-radius:8px;background:var(--surface-2);font-size:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.65);
}
.toast span{flex:1;min-width:0}
.toast button{
  flex:none;min-height:42px;padding:0 14px;border:0;border-radius:6px;
  background:#fff;color:#141414;font-weight:700;font-size:14px;
}
.toast button:active{background:#ddd}

/* Statistiche */
.vtitle{margin:18px 0 12px;font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,60px);line-height:.95;letter-spacing:.03em}
.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;height:44px;border:0;border-radius:6px;background:var(--surface);color:var(--text);font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:#fff;color:#141414}
.picker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.picker .arrow{width:42px;height:42px}
.picker .plabel{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:36px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
.kpi{background:var(--surface);border-radius:8px;padding:10px 10px 11px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;letter-spacing:.02em;white-space:nowrap}
.kpi b i{font-style:normal;font-size:.58em;color:var(--muted);letter-spacing:0}
.kpi b.pos{color:var(--pos)}
.kpi b.neg{color:var(--neg)}
.sect{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:16px}
.sect h3{margin:0 0 3px;font-size:17px;font-weight:600}
.sect .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.legend{display:flex;gap:16px;margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cap{margin:8px 0 0;min-height:2.6em;font-size:13.5px;color:var(--text)}
.cap span{color:var(--muted)}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart text{fill:#9b9b9b;font-family:var(--body);font-size:10px}
.chart .gl{stroke:#2e2e2e;stroke-width:1}
.chart .gz{stroke:#5a5a5a;stroke-width:1}
.chart .grp{cursor:pointer}
.empty{margin:4px 0 12px;color:var(--muted);font-size:14px}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.bn{font-size:15px;font-weight:500}
.bv{font-size:14.5px;font-weight:600;white-space:nowrap}
.bv em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px}
.bt{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bf{height:100%;border-radius:4px;background:var(--red)}
.endnote{margin:18px 0 6px;color:var(--muted);font-size:12.5px}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--surface);
  border-radius:14px 14px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.6);
}
.sheet h3{margin:0 0 16px;font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:.03em;line-height:1}
.fld{display:block;margin:0 0 14px}
.fld > span:not(.amt){display:block;margin:0 0 6px;color:var(--muted);font-size:13px}
.txt{
  width:100%;height:48px;padding:0 12px;border-radius:8px;border:2px solid transparent;
  background:var(--surface-2);color:var(--text);font:inherit;font-size:17px;outline:none;
}
.txt:focus{border-color:#fff;background:#333}
.amt.wide{width:100%;height:48px}
.sheet .seg{margin:0}
.sheet .seg button{font-size:14px}
.sheet .seg button:not([aria-pressed="true"]){background:var(--surface-2)}
.ferr{margin:-2px 0 12px;color:var(--neg);font-size:13.5px}
.sheet-actions{display:flex;gap:8px;margin-top:4px}
.sheet-actions button{flex:1;height:50px;border:0;border-radius:6px;font-weight:700;font-size:15.5px}
.btn-ghost{background:var(--surface-2)}
.btn-primary{background:var(--red);color:#fff}
.ver{margin:18px 0 0;font-size:12px;color:#6f6f6f}

@media (min-width:560px){
  .app{padding:0 24px}
  .strip,.dock{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px}
}
@media (prefers-reduced-motion:no-preference){
  .strip{scroll-behavior:smooth}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back" id="back" type="button" aria-label="Torna alla home" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="logo"><button type="button" id="logo" aria-label="NoBudget, vai alla home">NoBudget</button></h1>
  </header>

  <!-- HOME -->
  <section class="view" id="vHome" aria-label="Home">
    <div class="homewrap">
      <button type="button" class="bigtile budget" data-go="budget">
        <svg class="bt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span class="bt-title">Budget</span>
        <span class="bt-sub" id="homeBudgetSub"></span>
      </button>
      <button type="button" class="bigtile stats" data-go="stats">
        <svg class="bt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        <span class="bt-title">Statistiche</span>
        <span class="bt-sub">Mese, anno e dove vanno i soldi</span>
      </button>
    </div>
    <div class="homenote">
      <p id="storeNote"></p>
      <div class="backup">
        <button type="button" id="btnExport">Esporta backup</button>
        <button type="button" id="btnImport">Importa backup</button>
      </div>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <p class="ver" id="ver"></p>
    </div>
  </section>

  <!-- BUDGET -->
  <section class="view" id="vBudget" aria-label="Budget" hidden>
    <div class="monthbar">
      <div class="mtitle">
        <h2 class="mname" id="mname" aria-live="polite"></h2>
        <p class="mperiod" id="mperiod"></p>
      </div>
      <button class="arrow" id="prev" type="button" aria-label="Mese precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="arrow" id="next" type="button" aria-label="Mese successivo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="toolbar">
      <button type="button" class="pill" id="btnAdd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
      <button type="button" class="pill" id="btnEdit" aria-pressed="false"></button>
      <span class="colh">Budget<br>del mese</span>
    </div>
    <p class="edithint" id="editHint" hidden>Tocca il segno meno per togliere una voce da questo mese.</p>
    <div class="list" id="list"></div>
    <div class="sum" id="sum"></div>
  </section>

  <!-- STATISTICHE -->
  <section class="view" id="vStats" aria-label="Statistiche" hidden>
    <h2 class="vtitle">Statistiche</h2>
    <div class="seg" id="seg">
      <button type="button" data-mode="month" aria-pressed="true">Mese</button>
      <button type="button" data-mode="year" aria-pressed="false">Anno</button>
      <button type="button" data-mode="all" aria-pressed="false">Totale</button>
    </div>
    <div class="picker" id="picker">
      <button class="arrow" id="sPrev" type="button" aria-label="Precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="plabel" id="sLabel" aria-live="polite"></div>
      <button class="arrow" id="sNext" type="button" aria-label="Successivo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div id="statBody"></div>
  </section>

  <footer class="dock" id="dock" hidden>
    <div class="saldo" aria-live="polite">
      <span class="lbl">Saldo</span>
      <span class="num" id="saldo"></span>
    </div>
  </footer>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Nuova voce</h3>
    <label class="fld"><span>Nome</span><input class="txt" id="fName" type="text" maxlength="40" autocomplete="off" enterkeyhint="next" placeholder="Es. Regali"></label>
    <label class="fld"><span>Importo</span><span class="amt wide"><input id="fAmt" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0,00"><span class="eur">&euro;</span></span></label>
    <div class="fld"><span>Quando</span>
      <div class="seg" id="fWhen">
        <button type="button" data-when="one" aria-pressed="true"></button>
        <button type="button" data-when="fwd" aria-pressed="false"></button>
      </div>
    </div>
    <p class="ferr" id="fErr" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn-ghost" id="fCancel">Annulla</button>
      <button type="button" class="btn-primary" id="fOk">Aggiungi</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastBtn">Applica ai successivi</button>
</div>

<script>
(function(){
'use strict';

/*CORE-START*/
var N = 50;                 // novembre 2026 -> dicembre 2030
var START_Y = 2026, START_M = 11;
var BASE_PAY = 2020;
var MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var MABB   = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

function ym(i){
  var t = START_Y*12 + (START_M-1) + i;
  return { y: Math.floor(t/12), m: ((t%12)+12)%12 + 1 };
}

  {id:'luce_gas',      name:'Luce e gas',         hint:'Bimestrale',                 def:function(y,m){ return m%2===1 ? 93.02 : 0; }},

  {id:'tari',          name:'TARI',               hint:'Spalmata sui 12 mesi',       def:function(){ return 6.24; }},
  {id:'caldaia',       name:'Caldaia',            hint:'Annuale, a maggio',          def:function(y,m){ return m===5 ? 48 : 0; }},
  {id:'benzina',       name:'Benzina',            hint:'',                           def:function(){ return 160; }},
  {id:'assicurazione', name:'Assicurazione auto', hint:'Annuale, a giugno',          def:function(y,m){ return m===6 ? 400 : 0; }},
  {id:'bollo',         name:'Bollo auto',         hint:'A maggio, non nel 2027',     def:function(y,m){ return (m===5 && y!==2027) ? 200 : 0; }},
  {id:'psico',         name:'Psico',              hint:'',                           def:function(){ return 170; }},
  {id:'sport',         name:'Sport',              hint:'',                           def:function(){ return 130; }},
  {id:'abbonamenti',   name:'Abbonamenti',        hint:'Spotify e cellulare',        def:function(){ return 13.49; }},
  {id:'spesa',         name:'Spesa',              hint:'',                           def:function(){ return 250; }},
  {id:'divertimento',  name:'Divertimento',       hint:'',                           def:function(){ return 450; }},
  {id:'coniglio',      name:'Coniglio',           hint:'Cibo e vaccino',             def:function(){ return 23.75; }},
  {id:'altro',         name:'Altro',              hint:'Spese fuori categoria',      def:function(){ return 0; }}
];

CATS.forEach(function(c){
  var hasZero=false, hasPos=false;
  for(var i=0;i<N;i++){ var p=ym(i); var v=c.def(p.y,p.m); if(v>0) hasPos=true; else hasZero=true; }
  c.seasonal = hasZero && hasPos;
});

var state = { opening:0, ov:{}, inc:{}, off:{}, custom:[], t:0 };

// Voci aggiunte dall'utente: {id, name, amount, start, end} (indici dei mesi, estremi inclusi)
function customCat(u){ return {id:u.id, name:u.name, amount:u.amount, start:u.start, end:u.end, custom:true, seasonal:false, hint:''}; }
function allCats(){
  var out = [], altro = null;
  CATS.forEach(function(c){ if(c.id==='altro') altro = c; else out.push(c); });
  state.custom.forEach(function(u){ out.push(customCat(u)); });
  if(altro) out.push(altro);
  return out;
}
function findCat(id){ var a = allCats(); for(var k=0;k<a.length;k++) if(a[k].id===id) return a[k]; return null; }
function findCustom(id){ for(var k=0;k<state.custom.length;k++) if(state.custom[k].id===id) return state.custom[k]; return null; }
function inRange(c,i){ return !c.custom || (i>=c.start && i<=c.end); }
function isActive(c,i){
  if(!inRange(c,i)) return false;
  var o = state.off[i];
  return !(o && o[c.id]);
}

function defVal(c,i){
  if(c.custom) return (i>=c.start && i<=c.end) ? c.amount : 0;
  var p=ym(i); return c.def(p.y,p.m);
}
function catVal(c,i){
  var o = state.ov[i];
  if(o && typeof o[c.id]==='number') return o[c.id];
  return defVal(c,i);
}
function payVal(i){ return typeof state.inc[i]==='number' ? state.inc[i] : BASE_PAY; }
function cents(x){ return Math.round(x*100); }

function compute(){
  var spese=[], riporto=[], ricavo=[], saldo=[];
  var carry = cents(state.opening), cats = allCats();
  for(var i=0;i<N;i++){
    var tot=0;
    for(var k=0;k<cats.length;k++) if(isActive(cats[k],i)) tot += cents(catVal(cats[k],i));
    var rev = cents(payVal(i)) + carry;
    var bal = rev - tot;
    riporto.push(carry/100); spese.push(tot/100); ricavo.push(rev/100); saldo.push(bal/100);
    carry = bal;
  }
  return {spese:spese, riporto:riporto, ricavo:ricavo, saldo:saldo};
}

function fmt(n){
  var c = Math.round(Math.abs(n)*100);
  var neg = n<0 && c!==0;
  var int = Math.floor(c/100), dec = c%100;
  var s = String(int).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'\u2212':'') + s + ',' + (dec<10?'0':'') + dec;
}
function fmt0(n){
  var r = Math.round(n);
  var s = String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (r<0?'\u2212':'') + s;
}
function fmtIn(n){ return fmt(n).replace('\u2212','-'); }

function parse(raw){
  var s = String(raw).replace(/\u2212/g,'-').replace(/[\u20ac\s]/g,'');
  if(s==='') return 0;
  if(s==='-') return null;
  if(s.indexOf(',')>=0) s = s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s = s.replace(/\./g,'');
  else if(/^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace('.','');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  var n = parseFloat(s);
  return isFinite(n) ? Math.round(n*100)/100 : null;
}

function setCat(c,i,v){
  var d = defVal(c,i);
  if(cents(v)===cents(d)){
    if(state.ov[i]){ delete state.ov[i][c.id]; if(!Object.keys(state.ov[i]).length) delete state.ov[i]; }
  } else {
    if(!state.ov[i]) state.ov[i]={};
    state.ov[i][c.id]=v;
  }
}
function setPay(i,v){
  if(cents(v)===cents(BASE_PAY)) delete state.inc[i]; else state.inc[i]=v;
}
// Se l'utente scrive il ricavo totale, lo stipendio e' la parte che resta tolto il riporto.
function payFromRevenue(rev, carry){ return (cents(rev) - cents(carry))/100; }

function applyForward(c,i){
  var v = catVal(c,i);
  var d0 = defVal(c,i)>0;
  var m0 = ym(i).m;
  for(var j=i+1;j<N;j++){
    if(!isActive(c,j)) continue;
    var ok;
    if(!c.seasonal) ok = true;
    else if(d0) ok = defVal(c,j)>0;
    else ok = ym(j).m===m0;
    if(ok) setCat(c,j,v);
  }
}
function clearKey(map,i,id){ if(map[i]){ delete map[i][id]; if(!Object.keys(map[i]).length) delete map[i]; } }
function removeCat(c,i){ if(!state.off[i]) state.off[i]={}; state.off[i][c.id]=true; }
function restoreCat(id,i){ clearKey(state.off,i,id); }
function newId(){ return 'u_' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function addCustom(name, amount, start, end){
  var id = newId();
  state.custom.push({id:id, name:name, amount:amount, start:start, end:end});
  return id;
}
function deleteCustom(id){
  state.custom = state.custom.filter(function(u){ return u.id!==id; });
  for(var i=0;i<N;i++){ clearKey(state.ov,i,id); clearKey(state.off,i,id); }
}
// Toglie la voce dal mese i e da tutti i successivi.
function removeForward(c,i){
  if(c.custom){
    var u = findCustom(c.id); if(!u) return;
    if(i<=u.start){ deleteCustom(u.id); return; }
    u.end = Math.min(u.end, i-1);
    for(var j=i;j<N;j++){ clearKey(state.ov,j,u.id); clearKey(state.off,j,u.id); }
  } else {
    for(var k=i;k<N;k++) removeCat(c,k);
  }
}
function applyPayForward(i){
  var v = payVal(i);
  for(var j=i+1;j<N;j++) setPay(j,v);
}
/*CORE-END*/

/* ---------- Persistenza ---------- */
var APP_VERSION = '1.1';
var LS_KEY = 'nobudget.v1';
var docRef = null, cloudOn = false, saving = false, dirty = false, saveTimer = null;

function cleanNum(x){ return (typeof x==='number' && isFinite(x)) ? x : null; }
function adopt(s){
  var ov={}, inc={};
  if(s && s.ov) Object.keys(s.ov).forEach(function(i){
    var o=s.ov[i], out={};
    if(o && typeof o==='object') Object.keys(o).forEach(function(k){ var n=cleanNum(o[k]); if(n!==null) out[k]=n; });
    if(Object.keys(out).length) ov[i]=out;
  });
  if(s && s.inc) Object.keys(s.inc).forEach(function(i){ var n=cleanNum(s.inc[i]); if(n!==null) inc[i]=n; });
  var off={}, custom=[];
  if(s && s.off) Object.keys(s.off).forEach(function(i){
    var o=s.off[i], out={};
    if(o && typeof o==='object') Object.keys(o).forEach(function(k){ if(o[k]) out[k]=true; });
    if(Object.keys(out).length) off[i]=out;
  });
  if(s && Array.isArray(s.custom)) s.custom.forEach(function(u){
    if(!u || typeof u.id!=='string' || !/^u_[a-z0-9]+$/.test(u.id) || typeof u.name!=='string') return;
    var st = Math.max(0, Math.min(N-1, Math.floor(cleanNum(u.start)||0)));
    var en = Math.max(st, Math.min(N-1, Math.floor(cleanNum(u.end)||0)));
    custom.push({id:u.id, name:u.name.slice(0,40), amount:cleanNum(u.amount)||0, start:st, end:en});
  });
  state = { opening: cleanNum(s&&s.opening)||0, ov:ov, inc:inc, off:off, custom:custom, t: cleanNum(s&&s.t)||0 };
}
function serialize(){ return { v:2, t:state.t, opening:state.opening, ov:state.ov, inc:state.inc, off:state.off, custom:state.custom }; }
function localSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(serialize())); }catch(e){} }
function localLoad(){
  try{ var raw=localStorage.getItem(LS_KEY); if(raw) adopt(JSON.parse(raw)); }catch(e){}
}
function queueSave(){
  state.t = Date.now();
  localSave();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
function flush(){
  if(!docRef || saving || !dirty) return;
  saving = true; dirty = false;
  docRef.set(serialize()).then(function(){
    saving = false; if(dirty) flush();
  }, function(){
    saving = false;
    showToast('Salvataggio online non riuscito. I dati restano su questo dispositivo.');
  });
}
function rerenderCurrent(){
  if(view==='budget') renderMonth(); else if(view==='stats') renderStats(); else renderHome();
}
function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
      var db=r[0], user=r[1];
      if(!db || !user) return null;
      return user.id().then(function(id){
        if(!id) return null;
        docRef = db.doc('data/users/'+id+'/budget');
        cloudOn = true;
        return docRef.get().then(function(snap){
          var s = snap.exists ? snap.data() : null;
          if(s && (s.t||0) > state.t){ adopt(s); localSave(); }
          else if(state.t > 0 && (!s || state.t > (s.t||0))){ dirty = true; flush(); }
          rerenderCurrent();
          docRef.onSnapshot(function(sn){
            if(sn.metadata && sn.metadata.hasPendingWrites) return;
            if(!sn.exists) return;
            var d = sn.data();
            if(!d || (d.t||0) <= state.t) return;
            var a = document.activeElement;
            if(a && a.tagName==='INPUT') return;
            adopt(d); localSave(); rerenderCurrent();
          }, function(){});
        });
      });
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Riferimenti DOM ---------- */
var $ = function(id){ return document.getElementById(id); };
var vHome=$('vHome'), vBudget=$('vBudget'), vStats=$('vStats'), dock=$('dock'), back=$('back'), logo=$('logo');
var elList=$('list'), elSum=$('sum'), elStrip=$('strip'), elName=$('mname'), elPeriod=$('mperiod');
var elPrev=$('prev'), elNext=$('next'), elSaldo=$('saldo');
var elToast=$('toast'), elToastMsg=$('toastMsg'), elToastBtn=$('toastBtn');
var cur = 0, R = compute(), startVal = {}, toastTimer = null, toastAction = null;
var view = 'home', canBack = false;

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function initialIndex(){
  var d = new Date();
  var y = d.getFullYear(), m = d.getMonth()+1;
  if(d.getDate()>=26){ m++; if(m>12){ m=1; y++; } }
  var i = (y*12+(m-1)) - (START_Y*12+(START_M-1));
  return Math.max(0, Math.min(N-1, i));
}
function fitText(el){
  el.style.fontSize = '';
  var fs = parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>el.clientWidth && fs>22){ fs -= 2; el.style.fontSize = fs+'px'; }
}
function updateDockH(){
  document.documentElement.style.setProperty('--dockH', (view==='budget' ? dock.offsetHeight : 0)+'px');
}

/* ---------- Navigazione tra le schermate ---------- */
function show(v, push){
  view = v;
  if(typeof closeSheet==='function') closeSheet();
  if(typeof setEdit==='function' && editMode) setEdit(false);
  vHome.hidden = v!=='home'; vBudget.hidden = v!=='budget'; vStats.hidden = v!=='stats';
  dock.hidden = v!=='budget'; back.hidden = v==='home';
  hideToast();
  if(v==='home') renderHome();
  else if(v==='budget') renderMonth();
  else renderStats();
  updateDockH();
  window.scrollTo(0,0);
  if(push){ try{ history.pushState({v:v},'','#'+v); canBack = true; }catch(e){ canBack = false; } }
  if(v==='home') canBack = false;
}
function goHome(){
  if(view==='home') return;
  if(canBack){ try{ history.back(); return; }catch(e){} }
  show('home', false);
}
window.addEventListener('popstate', function(e){ show((e.state && e.state.v) || 'home', false); });
back.addEventListener('click', goHome);
logo.addEventListener('click', goHome);
vHome.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-go]') : null;
  if(b) show(b.getAttribute('data-go'), true);
});

/* ---------- Home ---------- */
function renderHome(){
  R = compute();
  var i = initialIndex(), p = ym(i), s = R.saldo[i];
  $('homeBudgetSub').textContent = cap(MONTHS[p.m-1])+' '+p.y+', saldo '+(s>0?'+':'')+fmt0(s)+' \u20ac';
  var tt = vHome.querySelectorAll('.bt-title'); for(var q=0;q<tt.length;q++) fitText(tt[q]);
  $('ver').textContent = 'NoBudget, versione '+APP_VERSION;
  $('storeNote').textContent = cloudOn
    ? 'I dati sono salvati sul tuo account e su questo dispositivo.'
    : 'I dati sono salvati solo su questo dispositivo. Ogni tanto esporta un backup.';
}

/* ---------- Backup ---------- */
function anchorDownload(name, text){
  try{
    var blob = new Blob([text], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }catch(e){ showToast('Esportazione non riuscita su questo dispositivo.'); }
}
function exportBackup(){
  var text = JSON.stringify({app:'NoBudget', exportedAt:new Date().toISOString(), data:serialize()}, null, 1);
  var name = 'nobudget-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(dl) dl.save({filename:name, data:text}).catch(function(e){ if(!e || e.code!=='declined') showToast('Esportazione non riuscita.'); });
      else anchorDownload(name, text);
    }).catch(function(){ anchorDownload(name, text); });
  } else anchorDownload(name, text);
}
$('btnExport').addEventListener('click', exportBackup);
$('btnImport').addEventListener('click', function(){ $('fileImport').click(); });
$('fileImport').addEventListener('change', function(){
  var inp = $('fileImport'), f = inp.files && inp.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var j = JSON.parse(r.result);
      var d = (j && j.data) ? j.data : j;
      if(!d || typeof d!=='object' || (!d.ov && !d.inc && !d.custom && !d.off && d.opening===undefined)) throw new Error('bad');
      showToast('Backup letto. Sostituisce i dati attuali.', 'Sostituisci', function(){
        adopt(d); queueSave(); rerenderCurrent(); showToast('Backup importato.');
      });
    }catch(e){ showToast('File non valido. Scegli un backup di NoBudget (.json).'); }
    inp.value = '';
  };
  r.readAsText(f);
});

/* ---------- Budget ---------- */
function svgReset(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
}
function buildStrip(){
  var h='';
  for(var i=0;i<N;i++){
    var p=ym(i);
    h += '<button type="button" class="tile" data-i="'+i+'">'+
         '<span class="tm">'+MABB[p.m-1]+'</span><span class="ty">'+p.y+'</span><span class="ts"></span></button>';
  }
  elStrip.innerHTML = h;
}
function amtHtml(k,label,value){
  return '<label class="amt"><input data-k="'+k+'" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="'+label+'" value="'+fmtIn(value)+'"><span class="eur">\u20ac</span></label>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
function rowHtml(c,i){
  var hint = c.custom ? (c.start===c.end ? 'Solo in questo mese' : 'Voce aggiunta da te') : c.hint;
  var n = esc(c.name);
  return '<div class="row" data-c="'+c.id+'">'+
    '<button type="button" class="minus" data-remove="'+c.id+'" aria-label="Togli '+n+' da questo mese"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></i></button>'+
    '<div class="nm"><span class="t">'+n+'</span>'+(hint?'<small>'+esc(hint)+'</small>':'')+'</div>'+
    '<button type="button" class="reset" aria-label="Ripristina l\u2019importo standard: '+n+'" title="Ripristina">'+svgReset()+'</button>'+
    amtHtml('c:'+c.id, n+', budget del mese', catVal(c,i))+
  '</div>';
}
function renderList(){
  var cats = allCats(), h = '', removed = [];
  cats.forEach(function(c){
    if(isActive(c,cur)) h += rowHtml(c,cur);
    else if(inRange(c,cur)) removed.push(c);
  });
  if(removed.length){
    h += '<div class="offhead">Tolte da questo mese</div>';
    removed.forEach(function(c){
      h += '<div class="row offrow"><div class="nm"><span class="t">'+esc(c.name)+'</span></div>'+
           '<button type="button" class="restore" data-restore="'+c.id+'" aria-label="Ripristina '+esc(c.name)+'">Ripristina</button></div>';
    });
  }
  elList.innerHTML = h;
  elList.classList.toggle('editing', editMode);
}
function renderMonth(){
  var p = ym(cur), pp = ym(cur-1);
  R = compute();
  elName.textContent = MONTHS[p.m-1];
  elPeriod.textContent = pp.y===p.y
    ? 'Dal 26 '+MONTHS[pp.m-1]+' al 26 '+MONTHS[p.m-1]+' '+p.y
    : 'Dal 26 '+MONTHS[pp.m-1]+' '+pp.y+' al 26 '+MONTHS[p.m-1]+' '+p.y;
  renderList();

  var first = cur===0;
  elSum.innerHTML =
    '<div class="row total"><div class="nm"><span class="t">Totale spese</span></div><div class="val" id="vTot"></div></div>'+
    '<div class="row" data-c="pay"><div class="nm"><span class="t">Stipendio</span><small>Quello che arriva il 26</small></div>'+
      '<button type="button" class="reset" aria-label="Ripristina lo stipendio standard" title="Ripristina">'+svgReset()+'</button>'+
      amtHtml('pay','Stipendio del mese', payVal(cur))+'</div>'+
    (first
      ? '<div class="row" data-c="open"><div class="nm"><span class="t">Riporto iniziale</span><small>Da dove parti a novembre</small></div>'+
        amtHtml('open','Riporto iniziale', state.opening)+'</div>'
      : '<div class="row"><div class="nm"><span class="t">Riporto da '+MONTHS[pp.m-1]+'</span><small>Saldo del mese precedente</small></div><div class="val" id="vCarry"></div></div>')+
    '<div class="row rev" data-c="rev"><div class="nm"><span class="t">Ricavo</span><small>Stipendio pi\u00f9 riporto</small></div>'+
      '<button type="button" class="reset" aria-label="Ripristina lo stipendio standard" title="Ripristina">'+svgReset()+'</button>'+
      amtHtml('rev','Ricavo del mese', R.ricavo[cur])+'</div>';

  hideToast();
  refresh();
  syncStrip(true);
  fitText(elName);
  elPrev.setAttribute('aria-disabled', cur===0 ? 'true':'false');
  elNext.setAttribute('aria-disabled', cur===N-1 ? 'true':'false');
}
function setMoney(el,n){ el.innerHTML = fmt(n)+'<span class="eur">\u20ac</span>'; }
function setInputUnlessFocused(k, v){
  var el = document.querySelector('input[data-k="'+k+'"]');
  if(el && document.activeElement!==el) el.value = fmtIn(v);
}
function refresh(){
  R = compute();
  var vTot=$('vTot'), vCarry=$('vCarry');
  if(vTot) setMoney(vTot, R.spese[cur]);
  if(vCarry) setMoney(vCarry, R.riporto[cur]);
  setInputUnlessFocused('pay', payVal(cur));
  setInputUnlessFocused('rev', R.ricavo[cur]);

  var s = R.saldo[cur];
  elSaldo.className = 'num ' + (s<0?'neg':'pos');
  elSaldo.innerHTML = (s>0?'+':'') + fmt(s) + '<small>\u20ac</small>';

  var rows = document.querySelectorAll('#vBudget [data-c]');
  for(var r=0;r<rows.length;r++){
    var row = rows[r], id = row.getAttribute('data-c'), edited=false, zero=false;
    if(id==='pay' || id==='rev'){ edited = cents(payVal(cur))!==cents(BASE_PAY); }
    else if(id!=='open'){
      var c = findCat(id);
      if(!c) continue;
      var v = catVal(c,cur);

}

function bindEdit(host){
  host.addEventListener('input', function(e){
    var el = e.target;

    queueSave();
  });
  host.addEventListener('focusin', function(e){
    var el = e.target;
    if(!el.matches || !el.matches('input[data-k]')) return;
    startVal[el.getAttribute('data-k')] = valueOf(el.getAttribute('data-k'));

  });
  host.addEventListener('change', function(e){
    var el = e.target;
    if(!el.matches || !el.matches('input[data-k]')) return;

    el.value = fmtIn(v);
    el.classList.remove('bad');
    var changed = cents(v)!==cents(startVal[k]===undefined ? v : startVal[k]);
    if(changed && k!=='open' && cur<N-1){
      var idx = cur, pm = ym(cur);
      showToast('Vale solo per '+MONTHS[pm.m-1]+'.', 'Applica ai successivi', function(){
        if(k==='pay' || k==='rev') applyPayForward(idx);
        else applyForward(catOf(k), idx);
        refresh(); queueSave();
        showToast('Applicato ai mesi successivi.');
      });
    }

  });
  host.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.matches && e.target.matches('input[data-k]')) e.target.blur();
  });
  host.addEventListener('click', function(e){

    else { var c = findCat(id); if(!c) return; setCat(c,cur,defVal(c,cur)); var inp=row.querySelector('input[data-k]'); inp.value = fmtIn(catVal(c,cur)); }
    refresh(); queueSave(); hideToast();
  });
}

var statMode = 'month', statYear = 2026, statYearInit = false;
var statBody = $('statBody'), sLabel = $('sLabel'), sPrev = $('sPrev'), sNext = $('sNext'), picker = $('picker');
var charts = {};
var C_ENT = '#9b9b9b', C_SPE = '#e50914', C_POS = '#46d369';

function idxsFor(mode){
  if(mode==='month') return [cur];
  var out=[];
  for(var i=0;i<N;i++){ if(mode==='all' || ym(i).y===statYear) out.push(i); }
  return out;
}
function sumCats(idxs){
  return allCats().map(function(c){
    var t=0; idxs.forEach(function(i){ if(isActive(c,i)) t += cents(catVal(c,i)); });
    return {name:c.name, v:t/100};
  });
}
function axisFor(minV, maxV){
  var hi = Math.max(maxV,0), lo0 = Math.min(minV,0);
  var span = hi - lo0; if(span<=0) span = 1;
  var raw = span/4, p = Math.pow(10, Math.floor(Math.log10(raw))), steps=[1,2,2.5,5,10], st=p*10;
  for(var i=0;i<steps.length;i++){ if(steps[i]*p>=raw-1e-9){ st=steps[i]*p; break; } }
  var top = st*Math.ceil(hi/st - 1e-9), lo = st*Math.floor(lo0/st + 1e-9);
  if(top<=lo) top = lo+st;
  return {lo:lo, top:top, step:st};
}
function signed(n){ return (n>0?'+':'')+fmt0(n); }

function kpiHtml(idxs){
  var ent=0, sp=0;
  idxs.forEach(function(i){ ent += cents(payVal(i)); sp += cents(R.spese[i]); });
  ent/=100; sp/=100;
  var mg = Math.round((ent-sp)*100)/100;
  return '<div class="kpis">'+
    '<div class="kpi"><small>Entrate</small><b>'+fmt0(ent)+'<i> \u20ac</i></b></div>'+
    '<div class="kpi"><small>Spese</small><b>'+fmt0(sp)+'<i> \u20ac</i></b></div>'+
    '<div class="kpi"><small>Margine</small><b class="'+(mg<0?'neg':'pos')+'">'+signed(mg)+'<i> \u20ac</i></b></div>'+
  '</div>';
}
function barsHtml(totals){
  var tot=0; totals.forEach(function(t){ if(cents(t.v)>0) tot += cents(t.v); });
  tot/=100;
  var rows = totals.filter(function(t){ return cents(t.v)>0; }).sort(function(a,b){ return b.v-a.v; });
  if(!rows.length) return '<p class="empty">Nessuna spesa in questo periodo.</p>';
  var max = rows[0].v, h = '<ol class="bars">';
  rows.forEach(function(t,k){
    var pct = t.v/tot*100, pt = pct<1 ? '<1%' : Math.round(pct)+'%';
    var op = Math.max(0.35, 1 - k*0.09);
    h += '<li><div class="bh"><span class="bn">'+esc(t.name)+'</span><span class="bv">'+fmt(t.v)+' \u20ac<em>'+pt+'</em></span></div>'+
         '<div class="bt"><div class="bf" style="width:'+(t.v/max*100).toFixed(1)+'%;opacity:'+op.toFixed(2)+'"></div></div></li>';
  });
  return h + '</ol>';
}
function colsChart(id, items, label){
  var W=360, H=190, L=44, Rm=6, T=8, B=22, pw=W-L-Rm, ph=H-T-B;
  var maxV=0; items.forEach(function(it){ maxV=Math.max(maxV,it.a,it.b); });
  var ax = axisFor(0, maxV), n = items.length, gw = pw/n, bw = Math.min(14, gw*0.34), gap = 2;
  charts[id] = {type:'cols', items:items};
  var s = '<svg class="chart" data-chart="'+id+'" data-kind="cols" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">';
  for(var v=0; v<=ax.top+1e-6; v+=ax.step){
    var y = T + ph - (v/ax.top)*ph;
    s += '<line class="'+(v===0?'gz':'gl')+'" x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
         '<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+fmt0(v)+'</text>';
  }
  items.forEach(function(it,k){
    var cx = L + gw*k + gw/2;
    var ha = Math.max(0,it.a/ax.top*ph), hb = Math.max(0,it.b/ax.top*ph);
    s += '<g class="grp" data-i="'+k+'">'+
      '<rect x="'+(cx-bw-gap/2).toFixed(1)+'" y="'+(T+ph-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" rx="2" fill="'+C_ENT+'"/>'+
      '<rect x="'+(cx+gap/2).toFixed(1)+'" y="'+(T+ph-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" rx="2" fill="'+C_SPE+'"/>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+it.label+'</text>'+
      '<rect x="'+(L+gw*k).toFixed(1)+'" y="'+T+'" width="'+gw.toFixed(1)+'" height="'+(ph+B)+'" fill="transparent"/>'+
    '</g>';
  });
  return s + '</svg>';
}
function lineChart(id, pts, label){
  var W=360, H=170, L=44, Rm=10, T=10, B=22, pw=W-L-Rm, ph=H-T-B, n=pts.length;
  var vals = pts.map(function(p){ return p.v; });
  var ax = axisFor(Math.min.apply(null,vals), Math.max.apply(null,vals));
  function X(k){ return n===1 ? L+pw/2 : L + pw*k/(n-1); }
  function Y(v){ return T + (ax.top-v)/(ax.top-ax.lo)*ph; }
  charts[id] = {type:'line', pts:pts, W:W, L:L, pw:pw, X:X, Y:Y};
  var s = '<svg class="chart" data-chart="'+id+'" data-kind="line" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">';
  for(var v=ax.lo; v<=ax.top+1e-6; v+=ax.step){
    var y = Y(v);
    s += '<line class="'+(Math.abs(v)<1e-6?'gz':'gl')+'" x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
         '<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+fmt0(v)+'</text>';
  }
  var d='', k;
  for(k=0;k<n;k++) d += (k?'L':'M')+X(k).toFixed(1)+' '+Y(pts[k].v).toFixed(1);
  var y0 = Y(0);
  s += '<path d="'+d+'L'+X(n-1).toFixed(1)+' '+y0.toFixed(1)+'L'+X(0).toFixed(1)+' '+y0.toFixed(1)+'Z" fill="'+C_POS+'" opacity=".14"/>';
  s += '<path d="'+d+'" fill="none" stroke="'+C_POS+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,k){ if(p.tick) s += '<text x="'+X(k).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+p.tick+'</text>'; });
  s += '<line id="gd-'+id+'" class="gl" y1="'+T+'" y2="'+(T+ph)+'" stroke="#777"/>'+
       '<circle id="gc-'+id+'" r="4.5" fill="#fff" stroke="'+C_POS+'" stroke-width="2"/>';
  return s + '</svg>';
}
function colCaption(it){
  var mg = Math.round((it.a-it.b)*100)/100;
  return '<b>'+it.full+'</b><br><span>Entrate</span> '+fmt0(it.a)+' \u20ac \u00a0 <span>Spese</span> '+fmt0(it.b)+' \u20ac \u00a0 <span>Margine</span> '+signed(mg)+' \u20ac';

function setLinePoint(id,k){

function lineFromEvent(svg, clientX){
  var id = svg.getAttribute('data-chart'), c = charts[id]; if(!c) return;
  var rect = svg.getBoundingClientRect();
  var x = (clientX-rect.left)*(c.W/rect.width);
  var k = Math.round((x-c.L)/c.pw*(c.pts.length-1));
  setLinePoint(id, Math.max(0, Math.min(c.pts.length-1, k)));

      LEGEND + colsChart('c1', its, 'Entrate e spese mese per mese, '+statYear) + '<p class="cap" id="cap-c1"><span>Tocca un mese per vedere i dettagli.</span></p>');
    var pts = idxs.map(function(i){ var pi=ym(i); return {v:R.saldo[i], full:cap(MONTHS[pi.m-1])+' '+pi.y, tick:MABB[pi.m-1]}; });
    html += section('Saldo accumulato', 'Quanto ti resta a fine mese, riporti inclusi. Scorri il dito sul grafico.',
      lineChart('l1', pts, 'Saldo accumulato nel '+statYear) + '<p class="cap" id="cap-l1"></p>');
    html += '<p class="endnote">I numeri mostrano il budget che hai impostato, non le spese reali.</p>';
    statBody.innerHTML = html;
    setLinePoint('l1', pts.length-1);
  } else {
    var years=[], map={};
    idxs.forEach(function(i){
      var y = ym(i).y;
      if(!map[y]){ map[y] = {label:String(y), full:'Anno '+y, a:0, b:0}; years.push(map[y]); }
      map[y].a += cents(payVal(i)); map[y].b += cents(R.spese[i]);
    });
    years.forEach(function(it){ it.a/=100; it.b/=100; });
    html += section('Anno per anno', 'Il 2026 comprende solo novembre e dicembre.',
      LEGEND + colsChart('c1', years, 'Entrate e spese anno per anno') + '<p class="cap" id="cap-c1"><span>Tocca un anno per vedere i dettagli.</span></p>');
    var pts2 = idxs.map(function(i){ var pi=ym(i); return {v:R.saldo[i], full:cap(MONTHS[pi.m-1])+' '+pi.y, tick: pi.m===1 ? String(pi.y) : ''}; });
    html += section('Saldo accumulato', 'Quanto ti resta a fine mese, riporti inclusi. Scorri il dito sul grafico.',
      lineChart('l1', pts2, 'Saldo accumulato da novembre 2026 a dicembre 2030') + '<p class="cap" id="cap-l1"></p>');
    html += '<p class="endnote">I numeri mostrano il budget che hai impostato, non le spese reali.</p>';
    statBody.innerHTML = html;
    setLinePoint('l1', pts2.length-1);
  }
  fitText(sLabel);
  var kb = statBody.querySelectorAll('.kpi b'); for(var q2=0;q2<kb.length;q2++) fitText(kb[q2]);
}
$('seg').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
  if(!b) return;
  statMode = b.getAttribute('data-mode'); renderStats();
});
sPrev.addEventListener('click', function(){
  if(statMode==='month') cur = Math.max(0, cur-1);
  else if(statMode==='year') statYear = Math.max(START_Y, statYear-1);
  renderStats();
});
sNext.addEventListener('click', function(){
  if(statMode==='month') cur = Math.min(N-1, cur+1);
  else if(statMode==='year') statYear = Math.min(2030, statYear+1);
  renderStats();
});

window.addEventListener('resize', function(){
  if(view==='budget') fitText(elName);
  if(view==='stats') fitText(sLabel);
  updateDockH();
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){
  if(view==='budget') fitText(elName);
  if(view==='stats') fitText(sLabel);
  updateDockH();
});

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  var hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(hadCtrl) showToast('Nuova versione pronta.', 'Ricarica', function(){ location.reload(); });
  });
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* ---------- Avvio ---------- */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
localLoad();
buildStrip();
cur = initialIndex();
try{ history.replaceState({v:'home'},'',location.pathname+location.search); }catch(e){}
show('home', false);
initCloud();
})();
</script>
